<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Windows 和 macOS 安装 Node.js 与 npm</title>
  <desc id="desc">Node.js LTS installation guide cover for Windows and macOS with npm registry setup.</desc>
