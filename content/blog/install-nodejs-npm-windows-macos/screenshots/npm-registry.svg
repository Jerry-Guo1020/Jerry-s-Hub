<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">npm 配置镜像源</title>
  <desc id="desc">Terminal output showing npm registry configured to npmmirror.</desc>
  <rect width="1100" height="620" fill="#fff8ed"/>
  <rect x="92" y="78" width="916" height="464" rx="18" fill="#1b1b1b"/>
  <rect x="92" y="78" width="916" height="56" rx="18" fill="#2b2b2b"/>
  <circle cx="126" cy="107" r="8" fill="#ff5f57"/>
  <circle cx="152" cy="107" r="8" fill="#febc2e"/>
  <circle cx="178" cy="107" r="8" fill="#28c840"/>
  <text x="218" y="113" font-family="Arial, sans-serif" font-size="17" fill="#e5e7eb">npm registry</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <text x="126" y="184" fill="#fed7aa">$ npm config set registry https://registry.npmmirror.com</text>
    <text x="126" y="252" fill="#fed7aa">$ npm config get registry</text>
    <text x="126" y="290" fill="#bbf7d0">https://registry.npmmirror.com/</text>
    <text x="126" y="358" fill="#fed7aa">$ npm ping</text>
    <text x="126" y="396" fill="#e5e7eb">npm notice PING https://registry.npmmirror.com/</text>
    <text x="126" y="434" fill="#bbf7d0">npm notice PONG 120ms</text>
  </g>
  <rect x="126" y="470" width="714" height="42" rx="8" fill="#30251a" stroke="#9a6b20" stroke-dasharray="8 8"/>
  <text x="148" y="498" font-family="Arial, sans-serif" font-size="18" fill="#fde68a">确认 registry 指向 npmmirror</text>
</svg>
