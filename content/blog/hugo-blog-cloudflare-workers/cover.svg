<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hugo 博客搭建与 Cloudflare 部署</title>
  <desc id="desc">Hugo 静态博客部署到 Cloudflare Workers 的构建与发布流程：Markdown 内容、hugo build 输出 public/、wrangler deploy 上线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#16233b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 H0 V42" fill="none" stroke="#334155" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.6"/>

  <!-- 顶部标题区 -->
  <g transform="translate(84 78)" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif">
    <text x="0" y="0" fill="#7c8db5" font-size="24" font-weight="700" letter-spacing="2">WEB OPS · HUGO &amp; CLOUDFLARE</text>
    <text x="0" y="66" fill="#f8fafc" font-size="62" font-weight="800">Hugo 博客搭建</text>
    <text x="0" y="136" fill="#f8fafc" font-size="62" font-weight="800">与 Cloudflare 部署</text>
    <text x="0" y="192" fill="#94a3b8" font-size="26">Markdown → hugo build → public/ → Workers Assets</text>
  </g>

  <!-- 左侧：目录结构 -->
  <g transform="translate(84 280)" font-family="'Cascadia Mono', Consolas, monospace">
    <rect x="0" y="0" width="330" height="290" rx="16" fill="#0b1220" stroke="#2b3b56" stroke-width="2" filter="url(#shadow)"/>
    <path d="M0 16 Q0 0 16 0 H314 Q330 0 330 16 V44 H0 Z" fill="#16233b"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="22" r="6" fill="#febc2e"/>
    <circle cx="68" cy="22" r="6" fill="#28c840"/>
    <text x="165" y="30" fill="#7c8db5" font-size="17" text-anchor="middle" font-weight="600">site tree</text>
    <text x="24" y="86" fill="#4ade80" font-size="19">content/</text>
    <text x="48" y="116" fill="#cbd5e1" font-size="17">blog/</text>
    <text x="48" y="144" fill="#cbd5e1" font-size="17">posts/</text>
    <text x="24" y="178" fill="#4ade80" font-size="19">layouts-custom/</text>
    <text x="24" y="212" fill="#4ade80" font-size="19">assets-custom/</text>
    <text x="24" y="246" fill="#4ade80" font-size="19">scripts/</text>
    <text x="48" y="274" fill="#cbd5e1" font-size="17">theme.js · hugo.sh</text>
  </g>

  <!-- 右侧：构建与部署 -->
  <g transform="translate(448 280)" font-family="'Cascadia Mono', Consolas, monospace">
    <rect x="0" y="0" width="556" height="290" rx="16" fill="#0b1220" stroke="#2b3b56" stroke-width="2" filter="url(#shadow)"/>
    <path d="M0 16 Q0 0 16 0 H540 Q556 0 556 16 V44 H0 Z" fill="#16233b"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="22" r="6" fill="#febc2e"/>
    <circle cx="68" cy="22" r="6" fill="#28c840"/>
    <text x="278" y="30" fill="#7c8db5" font-size="17" text-anchor="middle" font-weight="600">ci build</text>
    <text x="26" y="88" fill="#f59e0b" font-size="19">❯ npm run build</text>
    <text x="26" y="124" fill="#64748b" font-size="17">node scripts/theme.js</text>
    <text x="26" y="152" fill="#64748b" font-size="17">scripts/hugo.sh --minify</text>
    <text x="26" y="186" fill="#94a3b8" font-size="17">Pages: 116 · 0 errors</text>
    <text x="26" y="222" fill="#f59e0b" font-size="19">❯ npx wrangler deploy</text>
    <text x="26" y="258" fill="#4ade80" font-size="19">✓ 已上线 jerry-s-hub · 0.4s</text>
  </g>

  <!-- 底部说明 -->
  <text x="84" y="628" fill="#3f4d6a" font-family="'Cascadia Mono', Consolas, monospace" font-size="19">wrangler.toml · .nvmrc · hugo_stats.json · RSS</text>
</svg>