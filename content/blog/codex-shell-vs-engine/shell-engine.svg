<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">外壳与发动机</title>
  <desc id="desc">Codex / Claude Code 作为外壳，通过 base_url 与 API key 这层标准接口，接入 DeepSeek、Kimi、Claude、GPT 等不同的模型发动机。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外壳 -->
  <g>
    <rect x="40" y="90" width="340" height="140" rx="14" fill="#0b1220" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="140" fill="#10b981" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" text-anchor="middle">外壳 Shell</text>
    <text x="210" y="176" fill="#f8fafc" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" text-anchor="middle">Codex / Claude Code</text>
    <text x="210" y="206" fill="#64748b" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" text-anchor="middle">读写文件 · 执行命令 · 跑测试</text>
  </g>

  <!-- 标准接口 -->
  <g>
    <rect x="440" y="110" width="220" height="100" rx="12" fill="#0a0f1c" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#shadow)"/>
    <text x="550" y="152" fill="#7c8db5" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" text-anchor="middle">标准接口</text>
    <text x="550" y="182" fill="#fbbf24" font-family="'Cascadia Mono', Consolas, monospace" font-size="16" text-anchor="middle">base_url + key</text>
  </g>

  <!-- 发动机 -->
  <g>
    <rect x="720" y="90" width="340" height="140" rx="14" fill="#0b1220" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="890" y="140" fill="#f59e0b" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" text-anchor="middle">发动机 Engine</text>
    <text x="890" y="176" fill="#f8fafc" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" text-anchor="middle">DeepSeek / Kimi / Claude / GPT</text>
    <text x="890" y="206" fill="#64748b" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" text-anchor="middle">真正思考的模型（LLM）</text>
  </g>

  <!-- 连线 -->
  <line x1="380" y1="160" x2="434" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="666" y1="160" x2="714" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <text x="550" y="272" fill="#64748b" font-family="'Cascadia Mono', Consolas, monospace" font-size="16" text-anchor="middle">换发动机 = 换 base_url 指向的地址和模型名，外壳这边几乎不用动</text>
</svg>