<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">外壳、发动机，还有一套内置结构</title>
  <desc id="desc">Codex / Claude Code 这类套壳工具共三层：外壳负责手脚，内置结构负责引导式对话与 skills，发动机是底层可换的模型，靠 base_url + key 标准接口接入。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外壳 -->
  <g>
    <rect x="100" y="30" width="900" height="110" rx="14" fill="#0b1220" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="550" y="70" fill="#10b981" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" text-anchor="middle">外壳 Shell ＝ 手脚</text>
    <text x="550" y="105" fill="#f8fafc" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" text-anchor="middle">Codex / Claude Code</text>
    <text x="550" y="133" fill="#64748b" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" text-anchor="middle">读写文件 · 执行命令 · 跑测试 · 决定下一步调哪个工具</text>
  </g>

  <!-- 箭头 1 -->
  <line x1="550" y1="140" x2="550" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 内置结构 -->
  <g>
    <rect x="100" y="180" width="900" height="110" rx="14" fill="#0b1220" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
    <text x="550" y="220" fill="#a78bfa" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" text-anchor="middle">内置结构 ＝ 神经</text>
    <text x="550" y="255" fill="#f8fafc" font-family="'Cascadia Mono', Consolas, monospace" font-size="18" text-anchor="middle">引导式对话 · skills 技能 · 固定工作流</text>
    <text x="550" y="283" fill="#64748b" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" text-anchor="middle">官方默认配好：它问你 → 你回答 → 再动手</text>
  </g>

  <!-- 箭头 2 + 标准接口注释 -->
  <g>
    <line x1="550" y1="290" x2="550" y2="326" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="662" y="312" fill="#fbbf24" font-family="'Cascadia Mono', Consolas, monospace" font-size="16" text-anchor="middle">标准接口 base_url + key（发动机可换）</text>
  </g>

  <!-- 发动机 -->
  <g>
    <rect x="100" y="330" width="900" height="110" rx="14" fill="#0b1220" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="550" y="370" fill="#f59e0b" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" text-anchor="middle">发动机 Engine ＝ 脑子</text>
    <text x="550" y="405" fill="#f8fafc" font-family="'Cascadia Mono', Consolas, monospace" font-size="19" text-anchor="middle">DeepSeek / Kimi / Claude / GPT</text>
    <text x="550" y="433" fill="#64748b" font-family="'Cascadia Mono', Consolas, monospace" font-size="15" text-anchor="middle">真正思考的模型（LLM）—— 可换</text>
  </g>

  <!-- 底部说明 -->
  <text x="550" y="505" fill="#64748b" font-family="'Cascadia Mono', Consolas, monospace" font-size="16" text-anchor="middle">换发动机 ＝ 只动最下面那台（改 base_url 和模型名）；外壳和结构官方都配好了，开箱即用</text>
</svg>