<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">给 pi 配一套提问通知与状态灯</title>
  <desc id="desc">终端 AI 编程助手的状态指示灯与桌面通知示意图：空闲绿、工作中蓝、提问中橙，附系统通知卡片。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#16233b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 H0 V42" fill="none" stroke="#334155" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.6"/>

  <!-- 顶部标题区 -->
  <g transform="translate(84 78)" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif">
    <text x="0" y="0" fill="#7c8db5" font-size="24" font-weight="700" letter-spacing="2">AI TOOLING · PI AGENT</text>
    <text x="0" y="66" fill="#f8fafc" font-size="62" font-weight="800">给 pi 配一套</text>
    <text x="0" y="136" fill="#f8fafc" font-size="62" font-weight="800">提问通知与状态灯</text>
    <text x="0" y="192" fill="#94a3b8" font-size="26">桌面通知 · 状态指示灯 · 配置入库 GitHub</text>
  </g>

  <!-- 终端窗口 -->
  <g transform="translate(84 280)" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="640" height="290" rx="16" fill="#0b1220" stroke="#2b3b56" stroke-width="2" filter="url(#shadow)"/>
    <path d="M0 16 Q0 0 16 0 H624 Q640 0 640 16 V44 H0 Z" fill="#16233b"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="22" r="6" fill="#febc2e"/>
    <circle cx="68" cy="22" r="6" fill="#28c840"/>
    <text x="320" y="30" fill="#7c8db5" font-size="18" text-anchor="middle" font-weight="600">pi · agent-status.ts</text>

    <!-- 状态行 -->
    <g font-size="24" font-weight="600">
      <circle cx="40" cy="92" r="10" fill="#22c55e"/>
      <text x="66" y="99" fill="#cbd5e1">空闲 · Agent 等待输入</text>
    </g>
    <g font-size="24" font-weight="600">
      <circle cx="40" cy="142" r="10" fill="#3b82f6"/>
      <text x="66" y="149" fill="#cbd5e1">工作中 · Agent 正在执行任务</text>
    </g>
    <g font-size="24" font-weight="800">
      <circle cx="40" cy="192" r="12" fill="#f59e0b" filter="url(#glow)"/>
      <text x="66" y="199" fill="#f8fafc">提问中 · 有窗口弹起，等你回答</text>
    </g>

    <!-- 提示行 -->
    <text x="40" y="262" fill="#4b5563" font-family="'Cascadia Mono', Consolas, monospace" font-size="20">❯ pi /reload  <tspan fill="#f59e0b">●</tspan> 等待回答…</text>
  </g>

  <!-- 系统通知卡片 -->
  <g transform="translate(788 400)" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="330" height="132" rx="16" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="30" cy="32" r="12" fill="#f59e0b"/>
    <text x="56" y="31" fill="#111827" font-size="22" font-weight="800">Pi</text>
    <text x="56" y="56" fill="#64748b" font-size="17" font-weight="600">刚刚</text>
    <text x="28" y="92" fill="#111827" font-size="21" font-weight="700">正在问你问题</text>
    <text x="28" y="118" fill="#f59e0b" font-size="17" font-weight="600">需要你回答</text>
  </g>

  <!-- 底部说明 -->
  <text x="84" y="628" fill="#3f4d6a" font-family="'Cascadia Mono', Consolas, monospace" font-size="19">extensions: notify.ts · status-line.ts · protected-paths.ts</text>
</svg>