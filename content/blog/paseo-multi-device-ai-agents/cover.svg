  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 548 C180 496 315 606 470 554 C640 498 750 470 920 524 C1045 563 1130 576 1200 534 L1200 675 L0 675 Z" fill="#cfe6db" opacity="0.9"/>
