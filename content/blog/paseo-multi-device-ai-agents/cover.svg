<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">用 Paseo 把 AI 编程 Agent 搬上全家桶</title>
  <desc id="desc">Paseo + Tailscale multi-device deployment cover: Windows, fly NAS, macOS and iPhone running pi agent daemons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="0.5" stop-color="#eef8f4"/>
      <stop offset="1" stop-color="#eaf0ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" x2="1" y1="0" y2="1">
