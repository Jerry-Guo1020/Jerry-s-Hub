    <text x="24" y="100" fill="#1f6f5c" font-size="18" font-weight="700">100.64.0.2</text>
    <rect x="272" y="0" width="236" height="128" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="318" cy="40" r="21" fill="#1f6f5c"/>
    <text x="338" y="27" fill="#111827" font-size="22" font-weight="700">fnnas</text>
