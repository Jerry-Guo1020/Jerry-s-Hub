<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {{ now.Format "2006" }} {{ .Site.Params.author }}.</p>
    <div class="footer-links">
      {{ range .Site.Data.profile.links }}
        <a href="{{ .url }}">{{ .name }}</a>
      {{ end }}
    </div>
  </div>
</footer>
